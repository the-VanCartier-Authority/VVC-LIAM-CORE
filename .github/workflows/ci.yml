name: Recovery CI
on:
  pull_request:
  push:
    branches: [main, fix/p0-e01-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ''
      NVIDIA_API_KEY: ''
      LLM_PROVIDERS_JSON: '[]'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Validate toolchain
        run: |
          npm run check:runtime
          test "$(bun --version)" = '1.4.4'
      - name: Frozen installation
        run: bun install --frozen-lockfile
      - name: Regression suite
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install pinned Chromium for browser fixtures
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Chromium browser fixtures (external traffic blocked by fixtures)
        run: npm run test:browser
      - name: Production smoke with local fixtures
        run: npm run smoke:production
      - name: Verify lock and working tree
        run: |
          git diff --exit-code -- bun.lock package.json
          git diff --check
