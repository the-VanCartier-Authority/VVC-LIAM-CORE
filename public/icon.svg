<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff2a5f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e2638" stroke-width="6" />

  <!-- Outer Hologram Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e2638" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(0,240,255,0.25)" stroke-width="2" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="rgba(176,38,255,0.35)" stroke-width="3" stroke-dasharray="14 8" />

  <!-- Center Core Wave Orb -->
  <circle cx="256" cy="256" r="75" fill="#090d16" stroke="url(#neonCyan)" stroke-width="5" filter="url(#glow)" />

  <!-- Futuristic Cyber VC Monogram -->
  <path d="M190 200 L235 310 L256 310 L300 200 L275 200 L245 280 L215 200 Z" fill="url(#neonCyan)" filter="url(#glow)" />
  <path d="M305 200 L325 200 L325 310 L305 310 Z" fill="url(#neonViolet)" filter="url(#glow)" />

  <!-- Soundwave Frequency Ticks -->
  <line x1="256" y1="90" x2="256" y2="115" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="397" x2="256" y2="422" stroke="#ff2a5f" stroke-width="4" stroke-linecap="round" />
  <line x1="90" y1="256" x2="115" y2="256" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
  <line x1="397" y1="256" x2="422" y2="256" stroke="#b026ff" stroke-width="4" stroke-linecap="round" />
</svg>
