<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Brushed Gold Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#997C1E" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#806512" />
    </linearGradient>

    <!-- Polished Silver Metallic Gradient -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E0E0E0" />
      <stop offset="60%" stop-color="#A8A8A8" />
      <stop offset="85%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#707070" />
    </linearGradient>

    <!-- Neon Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66FF99" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#009933" />
    </linearGradient>

    <!-- Deep Obsidian Radial Gradient -->
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#140C1A" />
      <stop offset="65%" stop-color="#0A060D" />
      <stop offset="100%" stop-color="#050307" />
    </radialGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Bevel Drop Shadow -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Squircle with Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#obsidianBg)" stroke="url(#goldRim)" stroke-width="14" filter="url(#innerShadow)" />
  
  <!-- Secondary Inner Thin Gold Inset Rim -->
  <rect x="38" y="38" width="436" height="436" rx="90" fill="none" stroke="url(#goldRim)" stroke-width="3" opacity="0.75" />

  <!-- Circular Outer Armor Track (Silver Bevel) -->
  <circle cx="256" cy="256" r="186" fill="#0C0710" stroke="url(#silverBevel)" stroke-width="7" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#000000" stroke-width="4" opacity="0.6" />

  <!-- Neon Emerald Power Ring -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#emeraldGlow)" stroke-width="6" filter="url(#emeraldFilter)" opacity="0.95" />
  <circle cx="256" cy="256" r="152" fill="#09050C" stroke="#1F1528" stroke-width="2" />

  <!-- Radial Technical Ticks around circle -->
  <g stroke="#C0C0C0" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="256" y1="98" x2="256" y2="108" />
    <line x1="256" y1="404" x2="256" y2="414" />
    <line x1="98" y1="256" x2="108" y2="256" />
    <line x1="404" y1="256" x2="414" y2="256" />
    <line x1="144" y1="144" x2="151" y2="151" />
    <line x1="368" y1="144" x2="361" y2="151" />
    <line x1="144" y1="368" x2="151" y2="361" />
    <line x1="368" y1="368" x2="361" y2="361" />
  </g>

  <!-- Outer Silver Chevron Wings (The Great "V") -->
  <path d="M128 172 L198 172 L256 348 L314 172 L384 172 L278 392 L234 392 Z" 
        fill="url(#silverBevel)" 
        stroke="#4A4A4A" 
        stroke-width="2" 
        filter="url(#innerShadow)" />

  <!-- Silver Wings Highlight Facets (Left and Right Wings) -->
  <path d="M128 172 L198 172 L256 348 L234 348 Z" fill="#E6E6E6" opacity="0.4" />
  <path d="M384 172 L314 172 L256 348 L278 348 Z" fill="#999999" opacity="0.4" />

  <!-- Inner Brushed Gold Chevron & Shield (The Golden Heart) -->
  <path d="M206 206 L244 206 L256 314 L268 206 L306 206 L272 344 L240 344 Z" 
        fill="url(#goldRim)" 
        stroke="#7A6016" 
        stroke-width="2" 
        filter="url(#innerShadow)" />

  <!-- Gold Chevron Center Highlight Ridge -->
  <path d="M256 220 L256 332" stroke="#FFF5B8" stroke-width="3" stroke-linecap="round" />

  <!-- Central Emerald Gem / Core Diamond (The Radiant Core) -->
  <polygon points="256,128 274,188 256,224 238,188" 
           fill="url(#emeraldGlow)" 
           filter="url(#emeraldFilter)" 
           stroke="#B3FFCC" 
           stroke-width="2" />
  
  <!-- Gem Center Light Glint -->
  <polygon points="256,140 268,188 256,212 244,188" fill="#FFFFFF" opacity="0.6" />
</svg>
