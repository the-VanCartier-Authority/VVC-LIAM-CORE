<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vvcBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="70%" stop-color="#06080e" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="vvcNeonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vvcNeonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff2a5f" />
    </linearGradient>
    <linearGradient id="vvcGoldAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>
    <radialGradient id="vvcGlowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#b026ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Cyber Chassis -->
  <rect width="512" height="512" rx="112" fill="url(#vvcBgGrad)" stroke="#1a2336" stroke-width="4" />

  <!-- Outer Holographic Radar Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="rgba(0,240,255,0.2)" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(176,38,255,0.3)" stroke-width="3" stroke-dasharray="16 10" />

  <!-- Ambient Light Pulse -->
  <circle cx="256" cy="256" r="130" fill="url(#vvcGlowCenter)" />

  <!-- Cybernetic Liam Core Octagon Shield -->
  <polygon
    points="256,70 410,135 440,305 330,430 182,430 72,305 102,135"
    fill="#080c16"
    stroke="url(#vvcNeonCyan)"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#cyberGlow)"
  />

  <!-- Internal Circuit Node Grid -->
  <polygon
    points="256,125 365,185 365,315 256,380 147,315 147,185"
    fill="#04060b"
    stroke="#1e293b"
    stroke-width="3"
  />

  <!-- Stylized VVC Chevron Emblem -->
  <path
    d="M175 190 L256 345 L337 190 L297 190 L256 280 L215 190 Z"
    fill="url(#vvcNeonCyan)"
    filter="url(#cyberGlow)"
  />

  <!-- Liam Core Glowing Central Crystal Prism -->
  <polygon
    points="256,205 285,250 256,295 227,250"
    fill="url(#vvcGoldAmber)"
    stroke="#fff"
    stroke-width="1.5"
    filter="url(#cyberGlow)"
  />

  <!-- Soundwave Frequency Radar Ticks -->
  <line x1="256" y1="40" x2="256" y2="65" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="447" x2="256" y2="472" stroke="#ff2a5f" stroke-width="5" stroke-linecap="round" />
  <line x1="40" y1="256" x2="65" y2="256" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="447" y1="256" x2="472" y2="256" stroke="#b026ff" stroke-width="5" stroke-linecap="round" />

  <!-- Core Label -->
  <text x="256" y="475" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#00f0ff" letter-spacing="6">
    VVC LIAM CORE
  </text>
</svg>
